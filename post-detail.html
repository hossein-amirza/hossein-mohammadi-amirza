<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">نوشته | حسین محمدی آمیرزا</title>
  <meta name="description" id="page-desc" content="نوشته‌ای از حسین محمدی آمیرزا">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="subhero compact">
  <nav class="nav wrap">
    <a class="brand" href="index.html">✍️ حسین محمدی آمیرزا</a>

    <div class="links">
      <a href="index.html">خانه</a>
      <a href="blog/index.html">وبلاگ</a>
    </div>
  </nav>
</header>

<main class="section">

  <article class="wrap article">

    <span class="tag" id="post-tag">نوشته</span>

    <h1 id="post-title">در حال بارگذاری...</h1>

    <p class="article-lead" id="post-excerpt"></p>

    <p class="muted" id="post-date"></p>

    <div class="article-body" id="post-content">
      <p>در حال بارگذاری متن نوشته...</p>
    </div>

    <div class="article-nav">
      <a class="btn" href="blog/index.html">📚 بازگشت به وبلاگ</a>
    </div>

  </article>

</main>

<footer>
  <div class="wrap">
    © <span id="year"></span> حسین محمدی آمیرزا
  </div>
</footer>

<script src="script.js"></script>

<script>
document.getElementById("year").textContent =
  new Date().getFullYear();

const params = new URLSearchParams(window.location.search);
const postId = params.get("id");

fetch("posts/posts/posts.json")
  .then(function(response) {
    if (!response.ok) {
      throw new Error("posts.json پیدا نشد");
    }

    return response.json();
  })
  .then(function(data) {

    let posts;

    if (Array.isArray(data)) {
      posts = data;
    } else if (data && typeof data.content === "string") {
      posts = JSON.parse(data.content);
    } else if (data && Array.isArray(data.content)) {
      posts = data.content;
    } else {
      posts = [];
    }

    const post = posts.find(function(item) {
      return String(item.id) === String(postId);
    });

    if (!post) {
      document.getElementById("post-title").textContent =
        "نوشته یافت نشد";

      document.getElementById("post-content").innerHTML =
        "<p>این نوشته پیدا نشد.</p>";

      return;
    }

    document.getElementById("page-title").textContent =
      post.title + " | حسین محمدی آمیرزا";

    document.getElementById("page-desc").content =
      post.excerpt || post.title;

    document.getElementById("post-tag").textContent =
      post.tag || "نوشته";

    document.getElementById("post-title").textContent =
      post.title || "بدون عنوان";

    document.getElementById("post-excerpt").textContent =
      post.excerpt || "";

    document.getElementById("post-date").textContent =
      post.date ? "📅 " + post.date : "";

    let body = post.content || post.body || "";

    if (body) {
      const content = document.getElementById("post-content");

      if (/<[a-z][\s\S]*>/i.test(body)) {
        content.innerHTML = body;
      } else {

        const lines = body
          .replace(/\r\n/g, "\n")
          .replace(/\r/g, "\n")
          .split("\n");

        let html = "";

        lines.forEach(function(line) {

          line = line.trim();

          if (!line) {
            return;
          }

          if (line.startsWith("### ")) {

            html += "<h3>" +
              line.substring(4) +
              "</h3>";

          } else if (line.startsWith("## ")) {

            html += "<h2>" +
              line.substring(3) +
              "</h2>";

          } else if (line.startsWith("# ")) {

            html += "<h2>" +
              line.substring(2) +
              "</h2>";

          } else {

            line = line
              .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
              .replace(/\*(.*?)\*/g, "<em>$1</em>");

            html += "<p>" + line + "</p>";
          }

        });

        content.innerHTML = html;
      }

    } else {

      document.getElementById("post-content").innerHTML =
        "<p>متن نوشته پیدا نشد.</p>";
    }

  })
  .catch(function(error) {

    console.error(error);

    document.getElementById("post-title").textContent =
      "خطا در بارگذاری";

    document.getElementById("post-content").innerHTML =
      "<p>مشکلی در بارگذاری نوشته به وجود آمده است.</p>";
  });
</script>

</body>
</html>
