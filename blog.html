<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وبلاگ | حسین محمدی آمیرزا</title>
<meta name="description" content="وبلاگ حسین محمدی آمیرزا؛ نویسنده، شاعر، پژوهشگر تاریخ و فیلمنامه‌نویس">
<link rel="canonical" href="https://hossein-amirza.github.io/hossein-mohammadi-amirza/blog.html">

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap');
:root{--ink:#211b18;--ink2:#4b3b34;--paper:#f4efe7;--paper2:#fffaf2;--gold:#b78a3b;--gold2:#d5b56a;--wine:#6f2935;--line:#d8cbb9;--shadow:0 18px 60px rgba(49,33,23,.10)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Vazirmatn',Tahoma,sans-serif;line-height:2}a{color:inherit}.wrap{width:min(1180px,calc(100% - 40px));margin:auto}.hero{background:radial-gradient(circle at 15% 20%,rgba(213,181,106,.18),transparent 30%),linear-gradient(135deg,#171311,#2b211d 55%,#3a2924);color:#fff;padding-bottom:40px;position:relative;overflow:hidden}.nav{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:22px;padding-bottom:22px;position:relative;z-index:2}.brand{text-decoration:none;font-weight:800;font-size:1.35rem;color:#f2dfb2}.links{display:flex;gap:7px;flex-wrap:wrap}.links a{text-decoration:none;padding:7px 12px;border-radius:30px;color:#e9ddd0;font-size:.92rem;transition:.25s}.links a:hover{background:rgba(255,255,255,.09);color:#fff}.btn{display:inline-block;text-decoration:none;border:1px solid var(--gold);background:linear-gradient(135deg,#b78a3b,#d0aa5c);color:#201a16;padding:10px 22px;border-radius:999px;font-weight:700;margin:5px 7px 5px 0;box-shadow:0 8px 25px rgba(0,0,0,.12);transition:.25s}.btn:hover{transform:translateY(-2px)}.btn.ghost{background:transparent;color:inherit}.section{padding:50px 0}.paper{background:var(--paper2)}.section-heading{margin-bottom:35px}.section-heading h2{font-family:'Playfair Display','Vazirmatn',serif;font-size:clamp(2rem,4vw,3rem);margin:5px 0 10px}.eyebrow{color:var(--gold2);font-size:.84rem;font-weight:700;letter-spacing:.7px}.muted{color:#806f63}.blog-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.post-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:var(--shadow);transition:.3s}.post-card:hover{transform:translateY(-5px);box-shadow:0 24px 70px rgba(49,33,23,.14)}.post-card .tag{color:var(--gold2);font-size:.84rem;font-weight:700;letter-spacing:.7px}.post-card h2{font-size:1.45rem;line-height:1.6;margin:8px 0}.post-card p{color:#77675d}.post-card .post-date{color:#b9aaa0;font-size:.85rem}.no-post{text-align:center;padding:60px 0;color:#77675d}.back-link{display:inline-block;margin-top:20px;color:var(--wine);text-decoration:none}footer{background:#171311;color:#b9aaa0;padding:28px 0;text-align:center;font-size:.9rem}
@media(max-width:850px){.blog-grid{grid-template-columns:1fr}.links{justify-content:center}.nav{flex-direction:column}}
@media(max-width:520px){.wrap{width:min(100% - 24px,1180px)}.links a{font-size:.8rem;padding:6px 8px}.section{padding:40px 0}}
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="hero">
  <nav class="nav wrap">
    <a class="brand" href="index.html">حسین محمدی آمیرزا</a>
    <div class="links">
      <a href="index.html#about">درباره من</a>
      <a href="index.html#books">کتاب‌ها</a>
      <a href="index.html#screenplays">فیلمنامه‌ها</a>
      <a href="index.html#series">سریال‌ها</a>
      <a href="blog.html">وبلاگ</a>
      <a href="index.html#newworks">آثار جدید</a>
      <a href="index.html#contact">تماس</a>
    </div>
  </nav>
  <div class="wrap" style="padding:30px 0">
    <h1 style="font-family:'Playfair Display','Vazirmatn',serif;font-size:clamp(2rem,4vw,3.5rem);margin:0">📝 وبلاگ</h1>
    <p class="muted" style="color:#cbbfb5;font-size:1.2rem">همه نوشته‌ها و یادداشت‌های حسین محمدی آمیرزا</p>
  </div>
</header>

<!-- ===== MAIN ===== -->
<main>
<section class="section wrap" id="blog">
  <div id="all-posts-container">
    <div style="text-align:center;padding:40px;color:#77675d;">در حال بارگذاری نوشته‌ها...</div>
  </div>
</section>
</main>

<!-- ===== FOOTER ===== -->
<footer>
  <div class="wrap">
    © <span id="year"></span> حسین محمدی آمیرزا — تمامی حقوق محفوظ است.
  </div>
</footer>

<script>
// ===== تنظیم سال =====
document.addEventListener("DOMContentLoaded", function() {
  var y = document.getElementById("year");
  if (y) y.textContent = new Date().getFullYear();
});

// ===== بارگذاری همه نوشته‌ها از فایل JSON =====
document.addEventListener("DOMContentLoaded", function() {
  fetch('posts/posts.json')
    .then(response => {
      if (!response.ok) {
        throw new Error('فایل posts.json پیدا نشد');
      }
      return response.json();
    })
    .then(posts => {
      const container = document.getElementById('all-posts-container');
      
      // مرتب‌سازی بر اساس تاریخ (جدیدترین اول)
      posts.sort((a, b) => new Date(b.date) - new Date(a.date));
      
      let html = '<div class="blog-grid">';
      
      posts.forEach(post => {
        html += `
          <article class="post-card">
            <span class="tag">${post.tag || 'نوشته'}</span>
            <h2>${post.title}</h2>
            <p>${post.excerpt || ''}</p>
            <span class="post-date">📅 ${post.date || ''}</span>
            <div style="margin-top:15px;">
              <a class="btn" href="post-detail.html?id=${post.id}">خواندن مطلب</a>
            </div>
          </article>
        `;
      });
      
      html += '</div>';
      container.innerHTML = html;
    })
    .catch(error => {
      // اگر فایل JSON وجود نداشت، پیام خطا نمایش بده
      const container = document.getElementById('all-posts-container');
      container.innerHTML = `
        <div class="no-post">
          <h3>⚠️ نوشته‌ای یافت نشد</h3>
          <p>لطفاً فایل posts/posts.json را بررسی کنید.</p>
          <a class="btn" href="index.html">بازگشت به صفحه اصلی</a>
        </div>
      `;
    });
});
</script>

</body>
</html>
