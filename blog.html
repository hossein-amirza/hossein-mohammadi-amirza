<body>

<header class="subhero">
<nav class="nav wrap">

<div class="wrap subhero-content">
<span class="eyebrow">📝 دفتر نوشته‌ها</span>
<h1>وبلاگ حسین محمدی آمیرزا</h1>
<p>یادداشت‌ها، فصل‌های کتاب، پژوهش‌های تاریخی و نوشته‌های ادبی.</p>
</div>
</header>

<main class="section">
<div class="wrap blog-list" id="blog-posts">

<div style="text-align:center;padding:40px;color:#77675d;">
در حال بارگذاری نوشته‌ها...
</div>

</div>
</main>

<footer>
<div class="wrap">
© <span id="year"></span> حسین محمدی آمیرزا
</div>
</footer>

<script src="../script.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

const container = document.getElementById("blog-posts");

fetch("../content/posts.json")
.then(response => {

if (!response.ok) {
throw new Error("posts.json پیدا نشد");
}

return response.json();

})
.then(posts => {

if (!Array.isArray(posts) || posts.length === 0) {
throw new Error("هیچ نوشته‌ای پیدا نشد");
}

posts.sort((a, b) => {
return new Date(b.date || 0) - new Date(a.date || 0);
});

let html = "";

posts.forEach(post => {

html += `
<article class="post-card">

<span class="tag">
${post.tag || "نوشته"}
</span>

<h2>
${post.title || "بدون عنوان"}
</h2>

<p>
${post.excerpt || ""}
</p>

<a class="btn" href="../post-detail.html?id=${encodeURIComponent(post.id)}">
📖 خواندن مطلب
</a>

</article>
`;

});

container.innerHTML = html;

})

.catch(error => {

console.log(error);

container.innerHTML = `
<article class="post-card">

<span class="tag">وبلاگ</span>

<h2>
نوشته‌ها به‌زودی نمایش داده می‌شوند
</h2>

<p>
نوشته‌های منتشرشده در حال آماده‌سازی برای نمایش در وبلاگ هستند.
</p>

</article>
`;

});

});
</script>

</body>
</html>
