<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>دیدگاه مخاطبان | حسین محمدی آمیرزا</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #f5f1e8;
            color: #29251f;
            font-family:
                Tahoma,
                Arial,
                sans-serif;
            line-height: 1.9;
        }

        .comments-page {
            width: min(900px, calc(100% - 30px));
            margin: 40px auto 70px;
        }

        .comments-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .comments-header h1 {
            margin: 0 0 10px;
            font-size: 32px;
            font-weight: 700;
        }

        .comments-header p {
            margin: 0;
            color: #746d62;
            font-size: 16px;
        }

        .comments-card {
            background: #fffdf8;
            border: 1px solid #ddd4c5;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 28px;
            box-shadow: 0 5px 20px rgba(60, 45, 25, 0.06);
        }

        .comments-card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 700;
            font-size: 15px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            border: 1px solid #cfc5b5;
            background: #fff;
            color: #29251f;
            border-radius: 10px;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #8d7350;
            box-shadow: 0 0 0 3px rgba(141, 115, 80, 0.12);
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .submit-button {
            display: inline-block;
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            background: #4d3b28;
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .submit-button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .submit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message-box {
            display: none;
            margin-top: 18px;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 14px;
        }

        .message-box.success {
            display: block;
            background: #e8f4e8;
            color: #245b2a;
            border: 1px solid #b9d8bc;
        }

        .message-box.error {
            display: block;
            background: #faeaea;
            color: #7b2929;
            border: 1px solid #e2baba;
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .comment {
            background: #fff;
            border: 1px solid #ded6c9;
            border-radius: 12px;
            padding: 20px;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 10px;
        }

        .comment-name {
            font-size: 17px;
            font-weight: 700;
        }

        .comment-date {
            color: #8b8377;
            font-size: 12px;
            white-space: nowrap;
        }

        .comment-subject {
            font-weight: 700;
            margin-bottom: 8px;
            color: #5b4730;
        }

        .comment-message {
            color: #403a32;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .empty-comments {
            text-align: center;
            color: #81796d;
            padding: 25px 10px;
        }

        .loading {
            text-align: center;
            color: #81796d;
            padding: 20px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #5b4730;
            text-decoration: none;
            font-weight: 700;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .comments-page {
                width: min(100% - 20px, 900px);
                margin-top: 20px;
            }

            .comments-card {
                padding: 20px;
            }

            .comments-header h1 {
                font-size: 26px;
            }

            .comment-header {
                flex-direction: column;
                gap: 3px;
            }

            .comment-date {
                white-space: normal;
            }

            .submit-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="comments-page">

    <header class="comments-header">
        <h1>دیدگاه مخاطبان</h1>
        <p>
            نظر، نقد و دیدگاه خود را درباره آثار با ما در میان بگذارید.
        </p>
    </header>

    <!-- فرم ارسال دیدگاه -->
    <section class="comments-card">

        <h2>ارسال دیدگاه</h2>

        <form id="commentForm">

            <div class="form-group">
                <label for="name">نام</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    maxlength="100"
                    required
                    placeholder="نام خود را وارد کنید"
                >
            </div>

            <div class="form-group">
                <label for="subject">موضوع</label>
                <input
                    type="text"
                    id="subject"
                    name="subject"
                    maxlength="200"
                    placeholder="موضوع دیدگاه"
                >
            </div>

            <div class="form-group">
                <label for="message">دیدگاه شما</label>
                <textarea
                    id="message"
                    name="message"
                    maxlength="3000"
                    required
                    placeholder="دیدگاه خود را بنویسید..."
                ></textarea>
            </div>

            <button
                type="submit"
                class="submit-button"
                id="submitButton"
            >
                ارسال دیدگاه
            </button>

            <div id="formMessage" class="message-box"></div>

        </form>

    </section>


    <!-- دیدگاه‌های تأییدشده -->
    <section class="comments-card">

        <h2>دیدگاه‌های مخاطبان</h2>

        <div id="commentsList" class="comments-list">
            <div class="loading">
                در حال بارگذاری دیدگاه‌ها...
            </div>
        </div>

    </section>

    <a href="index.html" class="back-link">
        ← بازگشت به صفحه اصلی
    </a>

</div>


<script>

    /*
     * =========================================================
     * تنظیمات Supabase
     * =========================================================
     *
     * این دو مقدار مربوط به پروژه Supabase شما هستند.
     *
     * Project URL:
     * https://btxxfmysebtspwvuanvw.supabase.co
     *
     * Publishable Key:
     * sb_publishable_vYnOz5TZyQvn64xdFUkAWQ_lewHTL10
     *
     * فقط Publishable Key را در سایت قرار بده.
     * Secret Key را هرگز در این فایل قرار نده.
     */

    const SUPABASE_URL =
        "https://btxxfmysebtspwvuanvw.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_vYnOz5TZyQvn64xdFUkAWQ_lewHTL10";


    /*
     * ساخت اتصال به Supabase
     */
    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


    /*
     * عناصر صفحه
     */
    const commentForm =
        document.getElementById("commentForm");

    const submitButton =
        document.getElementById("submitButton");

    const formMessage =
        document.getElementById("formMessage");

    const commentsList =
        document.getElementById("commentsList");


    /*
     * نمایش پیام
     */
    function showMessage(message, type) {

        formMessage.textContent = message;

        formMessage.className =
            "message-box " + type;

    }


    /*
     * جلوگیری از نمایش HTML خطرناک
     */
    function escapeHTML(value) {

        const div = document.createElement("div");

        div.textContent = value ?? "";

        return div.innerHTML;

    }


    /*
     * تبدیل تاریخ به تاریخ فارسی
     */
    function formatDate(dateString) {

        const date = new Date(dateString);

        return new Intl.DateTimeFormat(
            "fa-IR",
            {
                year: "numeric",
                month: "long",
                day: "numeric"
            }
        ).format(date);

    }


    /*
     * نمایش دیدگاه‌های تأییدشده
     */
    async function loadComments() {

        commentsList.innerHTML =
            '<div class="loading">در حال بارگذاری دیدگاه‌ها...</div>';

        const { data, error } =
            await supabaseClient
                .from("comments")
                .select("id, name, subject, message, created_at")
                .eq("approved", true)
                .order("created_at", {
                    ascending: false
                });


        if (error) {

            console.error(error);

            commentsList.innerHTML =
                '<div class="empty-comments">' +
                'در حال حاضر امکان بارگذاری دیدگاه‌ها وجود ندارد.' +
                '</div>';

            return;
        }


        if (!data || data.length === 0) {

            commentsList.innerHTML =
                '<div class="empty-comments">' +
                'هنوز دیدگاهی منتشر نشده است. اولین نفر باشید که دیدگاه خود را می‌نویسد.' +
                '</div>';

            return;
        }


        commentsList.innerHTML = "";


        data.forEach(function(comment) {

            const article =
                document.createElement("article");

            article.className = "comment";


            const header =
                document.createElement("div");

            header.className = "comment-header";


            const name =
                document.createElement("div");

            name.className = "comment-name";

            name.textContent =
                comment.name || "مخاطب";


            const date =
                document.createElement("div");

            date.className = "comment-date";

            date.textContent =
                formatDate(comment.created_at);


            header.appendChild(name);
            header.appendChild(date);


            article.appendChild(header);


            if (comment.subject) {

                const subject =
                    document.createElement("div");

                subject.className =
                    "comment-subject";

                subject.textContent =
                    comment.subject;

                article.appendChild(subject);

            }


            const message =
                document.createElement("div");

            message.className =
                "comment-message";

            message.textContent =
                comment.message;


            article.appendChild(message);


            commentsList.appendChild(article);

        });

    }


    /*
     * ارسال دیدگاه
     */
    commentForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const name =
                document.getElementById("name")
                    .value
                    .trim();


            const subject =
                document.getElementById("subject")
                    .value
                    .trim();


            const message =
                document.getElementById("message")
                    .value
                    .trim();


            if (!name) {

                showMessage(
                    "لطفاً نام خود را وارد کنید.",
                    "error"
                );

                return;

            }


            if (!message) {

                showMessage(
                    "لطفاً دیدگاه خود را بنویسید.",
                    "error"
                );

                return;

            }


            submitButton.disabled = true;

            submitButton.textContent =
                "در حال ارسال...";

            formMessage.className =
                "message-box";


            /*
             * دیدگاه ابتدا تأیید نشده ذخیره می‌شود.
             *
             * approved = false
             *
             * بعد از بررسی توسط مدیر سایت،
             * می‌توان آن را در Supabase تأیید کرد.
             */

            const { error } =
                await supabaseClient
                    .from("comments")
                    .insert([
                        {
                            name: name,
                            subject: subject,
                            message: message,
                            approved: false
                        }
                    ]);


            if (error) {

                console.error(error);

                showMessage(
                    "متأسفانه ارسال دیدگاه انجام نشد. لطفاً دوباره تلاش کنید.",
                    "error"
                );

                submitButton.disabled = false;

                submitButton.textContent =
                    "ارسال دیدگاه";

                return;

            }


            /*
             * موفقیت
             */
            commentForm.reset();

            showMessage(
                "دیدگاه شما با موفقیت دریافت شد و پس از بررسی منتشر خواهد شد.",
                "success"
            );


            submitButton.disabled = false;

            submitButton.textContent =
                "ارسال دیدگاه";

        }
    );


    /*
     * بارگذاری دیدگاه‌ها هنگام باز شدن صفحه
     */
    loadComments();

</script>

</body>
</html>
