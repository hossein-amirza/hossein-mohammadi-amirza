<!doctype html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>وبلاگ حسین محمدی آمیرزا</title>

  <meta
    name="description"
    content="وبلاگ حسین محمدی آمیرزا؛ جست‌وجوی معنا در تاریخ، ادیان و اندیشه"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;500;600&display=swap"
    rel="stylesheet"
  >


  <style>

    /* =====================================================
       وبلاگ حسین محمدی آمیرزا
       طراحی مشکی ـ طلایی ادبی
       ===================================================== */

    :root {
      --black: #090806;
      --black-soft: #12100d;
      --black-card: #17140f;

      --gold: #d4af37;
      --gold-light: #f0d77a;
      --gold-soft: #b99a52;
      --gold-faint: rgba(212,175,55,.18);

      --cream: #f1eadc;
      --cream-soft: #cfc5b1;
      --muted: #9b907b;
    }


    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {

      min-height: 100vh;

      background:

        radial-gradient(
          circle at 12% 8%,
          rgba(212,175,55,.13),
          transparent 25%
        ),

        radial-gradient(
          circle at 88% 22%,
          rgba(212,175,55,.08),
          transparent 28%
        ),

        radial-gradient(
          circle at 50% 100%,
          rgba(110,95,58,.15),
          transparent 38%
        ),

        linear-gradient(
          145deg,
          #090806 0%,
          #15120e 45%,
          #0a0907 100%
        );

      background-attachment: fixed;

      color: var(--cream);

      font-family:
        "Noto Naskh Arabic",
        "Amiri",
        serif;
    }


    /* =====================================================
       قاب اصلی
       ===================================================== */

    .blog-container {

      width: min(100% - 32px, 1080px);

      margin: 48px auto 65px;

      padding:
        58px
        64px
        65px;

      position: relative;

      background:

        linear-gradient(
          145deg,
          rgba(23,20,15,.98),
          rgba(12,10,8,.97)
        );

      border:
        1px solid rgba(212,175,55,.26);

      border-radius: 30px;

      box-shadow:

        0 35px 100px rgba(0,0,0,.72),

        0 10px 35px rgba(0,0,0,.50),

        inset 0 1px 0 rgba(255,255,255,.045),

        inset 0 0 45px rgba(212,175,55,.025);

      overflow: hidden;
    }


    /* قاب طلایی داخلی */

    .blog-container::before {

      content: "";

      position: absolute;

      inset: 15px;

      border:
        1px solid rgba(212,175,55,.10);

      border-radius: 22px;

      pointer-events: none;
    }


    .blog-container::after {

      content: "✦";

      position: absolute;

      top: 16px;
      left: 50%;

      transform: translateX(-50%);

      color: rgba(212,175,55,.35);

      font-size: .9rem;

      pointer-events: none;
    }


    /* =====================================================
       سربرگ
       ===================================================== */

    .blog-header {

      text-align: center;

      padding:
        12px
        20px
        42px;

      margin-bottom: 38px;

      position: relative;
    }


    .blog-header::before {

      content: "❈";

      display: block;

      margin-bottom: 10px;

      color: var(--gold);

      font-size: 1.45rem;
    }


    .blog-header h1 {

      font-family:
        "Noto Nastaliq Urdu",
        "Amiri",
        serif;

      font-size:
        clamp(2rem, 5vw, 3.2rem);

      font-weight: 400;

      line-height: 2.1;

      color: var(--gold);

      text-align: center;

      text-shadow:

        0 2px 5px rgba(0,0,0,.85),

        0 0 24px rgba(212,175,55,.08);
    }


    .blog-header .subtitle {

      margin-top: 15px;

      font-family:
        "Amiri",
        "Noto Naskh Arabic",
        serif;

      font-size: 1.18rem;

      line-height: 2;

      color: var(--gold-soft);

      text-align: center;
    }


    .gold-line {

      width: 220px;

      height: 1px;

      margin: 25px auto 0;

      background:

        linear-gradient(
          to right,
          transparent,
          var(--gold),
          transparent
        );

      opacity: .65;
    }


    /* =====================================================
       لیست نوشته‌ها
       ===================================================== */

    .post-list {

      display: flex;

      flex-direction: column;

      gap: 34px;
    }


    /* =====================================================
       کارت مقاله
       ===================================================== */

    .post-card {

      position: relative;

      padding:
        38px
        44px
        42px;

      background:

        linear-gradient(
          145deg,
          rgba(27,23,17,.98),
          rgba(11,9,7,.98)
        );

      border:
        1px solid rgba(212,175,55,.16);

      border-radius: 23px;

      box-shadow:

        0 15px 42px rgba(0,0,0,.38),

        inset 0 1px 0 rgba(255,255,255,.035);

      transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;

      overflow: hidden;
    }


    /* حاشیهٔ ظریف داخل کارت */

    .post-card::before {

      content: "";

      position: absolute;

      inset: 10px;

      border:
        1px solid rgba(212,175,55,.055);

      border-radius: 16px;

      pointer-events: none;
    }


    /* نقش کوچک بالای کارت */

    .post-card::after {

      content: "✦";

      position: absolute;

      top: 18px;
      left: 22px;

      color:
        rgba(212,175,55,.32);

      font-size: .82rem;

      pointer-events: none;
    }


    .post-card:hover {

      transform: translateY(-5px);

      border-color:
        rgba(212,175,55,.34);

      box-shadow:

        0 24px 55px rgba(0,0,0,.50),

        0 0 25px rgba(212,175,55,.035);
    }


    /* =====================================================
       پلاک شماره مقاله
       ===================================================== */

    .article-number {

      width: fit-content;

      margin:
        0
        auto
        23px;

      padding:
        5px
        19px;

      background:
        #080705;

      border:
        1px solid
        rgba(212,175,55,.34);

      color:
        var(--gold);

      border-radius:
        999px;

      font-family:
        "Noto Naskh Arabic",
        sans-serif;

      font-size:
        .88rem;

      box-shadow:
        0 4px 14px rgba(0,0,0,.30);
    }


    /* =====================================================
       عنوان مقاله
       ===================================================== */

    .post-title {

      display: block;

      max-width: 830px;

      margin:
        0
        auto
        22px;

      font-family:
        "Noto Nastaliq Urdu",
        "Amiri",
        serif;

      font-size:
        clamp(1.55rem, 3vw, 2.3rem);

      font-weight: 400;

      line-height: 2.1;

      text-align: center;

      color:
        var(--gold-light);

      text-decoration: none;

      text-shadow:
        0 2px 7px rgba(0,0,0,.60);

      transition:
        color .25s ease;
    }


    .post-title:hover {

      color:
        #ffe8a1;
    }


    /* =====================================================
       اطلاعات مقاله
       ===================================================== */

    .post-meta {

      display: flex;

      justify-content: center;

      align-items: center;

      flex-wrap: wrap;

      gap: 10px 13px;

      margin-bottom: 23px;
    }


    .post-meta span {

      display: inline-flex;

      align-items: center;

      gap: 5px;

      padding:
        6px
        15px;

      background:
        #090806;

      border:
        1px solid
        rgba(212,175,55,.22);

      border-radius:
        999px;

      color:
        var(--gold);

      font-size:
        .9rem;

      line-height: 1.7;
    }


    .post-meta .date {

      color:
        #e7d7a7;
    }


    .post-meta .category {

      color:
        var(--gold);
    }


    /* =====================================================
       جداکننده
       ===================================================== */

    .post-divider {

      width: 90px;

      height: 1px;

      margin:
        0
        auto
        23px;

      background:

        linear-gradient(
          to right,
          transparent,
          rgba(212,175,55,.65),
          transparent
        );
    }


    /* =====================================================
       خلاصه مقاله
       ===================================================== */

    .post-excerpt {

      max-width: 800px;

      margin:
        0
        auto
        26px;

      font-family:
        "Noto Naskh Arabic",
        "Amiri",
        serif;

      font-size:
        1.08rem;

      line-height:
        2.35;

      text-align:
        right;

      color:
        #d0c6b5;
    }


    /* =====================================================
       دکمه ادامه مطلب
       ===================================================== */

    .read-more {

      display: table;

      margin:
        0
        auto;

      padding:
        9px
        27px;

      background:
        #050403;

      border:
        1px solid
        rgba(212,175,55,.42);

      border-radius:
        999px;

      color:
        var(--gold-light);

      font-family:
        "Noto Naskh Arabic",
        sans-serif;

      font-size:
        .95rem;

      text-decoration:
        none;

      box-shadow:
        0 5px 15px rgba(0,0,0,.35);

      transition:
        all .25s ease;
    }


    .read-more:hover {

      background:
        var(--gold);

      color:
        #0b0906;

      border-color:
        var(--gold);

      box-shadow:
        0 8px 25px
        rgba(212,175,55,.22);

      transform:
        translateY(-2px);
    }


    /* =====================================================
       فوتر
       ===================================================== */

    .blog-footer {

      position: relative;

      margin-top: 55px;

      padding-top: 33px;

      border-top:
        1px solid
        rgba(212,175,55,.13);

      text-align: center;

      color:
        #897d69;

      font-size:
        .9rem;
    }


    .blog-footer::before {

      content:
        "❧";

      position: absolute;

      top: -17px;

      left: 50%;

      transform:
        translateX(-50%);

      padding:
        0 15px;

      background:
        #0d0b09;

      color:
        rgba(212,175,55,.55);

      font-size:
        1.15rem;
    }


    /* =====================================================
       موبایل
       ===================================================== */

    @media (max-width: 700px) {

      body {
        padding: 0;
      }


      .blog-container {

        width:
          calc(100% - 18px);

        margin:
          16px
          auto
          28px;

        padding:
          42px
          19px
          46px;

        border-radius:
          24px;
      }


      .blog-container::before {

        inset:
          9px;

        border-radius:
          17px;
      }


      .blog-header {

        padding:
          12px
          8px
          30px;

        margin-bottom:
          28px;
      }


      .blog-header h1 {

        font-size:
          1.9rem;

        line-height:
          2.05;
      }


      .blog-header .subtitle {

        font-size:
          .98rem;

        line-height:
          2.1;
      }


      .gold-line {

        width:
          150px;
      }


      .post-list {

        gap:
          23px;
      }


      .post-card {

        padding:
          32px
          20px
          34px;

        border-radius:
          20px;
      }


      .post-title {

        font-size:
          1.5rem;

        line-height:
          2.05;
      }


      .post-excerpt {

        font-size:
          .99rem;

        line-height:
          2.2;
      }


      .post-meta {

        gap:
          8px;
      }


      .post-meta span {

        font-size:
          .82rem;

        padding:
          5px
          11px;
      }


      .read-more {

        font-size:
          .9rem;

        padding:
          8px
          23px;
      }

    }

  </style>

</head>


<body>


  <main class="blog-container">


    <!-- ===================================================
         سربرگ
         =================================================== -->

    <header class="blog-header">

      <h1>
        وبلاگ حسین محمدی آمیرزا
      </h1>

      <div class="subtitle">
        جست‌وجوی معنا در مسیر تاریخ، ادیان و اندیشه
      </div>

      <div class="gold-line"></div>

    </header>


    <!-- ===================================================
         نوشته‌ها
         =================================================== -->

    <section
      id="posts-container"
      class="post-list"
    >

      <article class="post-card">

        <div
          class="article-number"
        >
          در حال بارگذاری...
        </div>

        <div class="post-title">
          نوشته‌ها در حال بارگذاری هستند...
        </div>

      </article>

    </section>


    <!-- ===================================================
         فوتر
         =================================================== -->

    <footer class="blog-footer">

      ©
      <span id="year"></span>
      حسین محمدی آمیرزا

    </footer>


  </main>


  <script>

    /* =====================================================
       سال
       ===================================================== */

    document.getElementById("year").textContent =
      new Date().getFullYear();


    /* =====================================================
       تبدیل تاریخ میلادی به شمسی
       ===================================================== */

    function gregorianToJalali(gDate) {

      const date =
        new Date(gDate);

      if (isNaN(date.getTime())) {
        return gDate;
      }

      let gy =
        date.getFullYear();

      let gm =
        date.getMonth() + 1;

      let gd =
        date.getDate();

      const gDaysInMonth = [
        31,28,31,30,31,30,
        31,31,30,31,30,31
      ];

      const jDaysInMonth = [
        31,31,31,31,31,31,
        30,30,30,30,30,29
      ];

      let gy2 =
        gy - 1600;

      let gm2 =
        gm - 1;

      let gd2 =
        gd - 1;


      let gDayNo =
        365 * gy2 +
        Math.floor((gy2 + 3) / 4) -
        Math.floor((gy2 + 99) / 100) +
        Math.floor((gy2 + 399) / 400);


      for (
        let i = 0;
        i < gm2;
        i++
      ) {

        gDayNo +=
          gDaysInMonth[i];

      }


      if (
        gm2 > 1 &&
        (
          gy % 4 === 0 &&
          gy % 100 !== 0
        ) ||
        gy % 400 === 0
      ) {

        gDayNo++;

      }


      gDayNo +=
        gd2;


      let jDayNo =
        gDayNo - 79;

      let jNp =
        Math.floor(
          jDayNo / 12053
        );

      jDayNo =
        jDayNo % 12053;


      let jy =
        979 +
        33 * jNp +
        4 *
        Math.floor(
          jDayNo / 1461
        );

      jDayNo =
        jDayNo % 1461;


      if (
        jDayNo >= 366
      ) {

        jy +=
          Math.floor(
            (jDayNo - 1) / 365
          );

        jDayNo =
          (jDayNo - 1) % 365;

      }


      let jm;
      let jd;


      for (
        let i = 0;
        i < 11 &&
        jDayNo >= jDaysInMonth[i];
        i++
      ) {

        jDayNo -=
          jDaysInMonth[i];

      }


      jm =
        i + 1;

      jd =
        jDayNo + 1;


      return (
        jy +
        "/" +
        String(jm).padStart(2, "0") +
        "/" +
        String(jd).padStart(2, "0")
      );

    }


    /* =====================================================
       فارسی کردن اعداد
       ===================================================== */

    function toPersianNumbers(value) {

      return String(value)
        .replace(/0/g, "۰")
        .replace(/1/g, "۱")
        .replace(/2/g, "۲")
        .replace(/3/g, "۳")
        .replace(/4/g, "۴")
        .replace(/5/g, "۵")
        .replace(/6/g, "۶")
        .replace(/7/g, "۷")
        .replace(/8/g, "۸")
        .replace(/9/g, "۹");

    }


    /* =====================================================
       دریافت نوشته‌ها
       ===================================================== */

    fetch("../posts/posts/posts.json")

      .then(function(response) {

        if (!response.ok) {

          throw new Error(
            "posts.json پیدا نشد"
          );

        }

        return response.json();

      })

      .then(function(data) {

        let posts;


        if (Array.isArray(data)) {

          posts = data;

        }

        else if (
          data &&
          typeof data.content === "string"
        ) {

          posts =
            JSON.parse(
              data.content
            );

        }

        else if (
          data &&
          Array.isArray(data.content)
        ) {

          posts =
            data.content;

        }

        else {

          posts = [];

        }


        const container =
          document.getElementById(
            "posts-container"
          );


        if (!posts.length) {

          container.innerHTML =

            '<article class="post-card">' +

              '<div class="article-number">' +
                'وبلاگ' +
              '</div>' +

              '<div class="post-title">' +
                'هنوز نوشته‌ای منتشر نشده است.' +
              '</div>' +

            '</article>';

          return;
        }


        /* مرتب‌سازی از جدید به قدیم */

        posts.sort(function(a, b) {

          return (
            new Date(b.date) -
            new Date(a.date)
          );

        });


        container.innerHTML = "";


        posts.forEach(
          function(post, index) {


            const card =
              document.createElement(
                "article"
              );

            card.className =
              "post-card";


            /* شماره مقاله */

            const number =
              document.createElement(
                "div"
              );

            number.className =
              "article-number";

            number.textContent =
              "مقاله شماره " +
              toPersianNumbers(index + 1);


            /* عنوان */

            const title =
              document.createElement(
                "a"
              );

            title.className =
              "post-title";

            title.textContent =
              post.title ||
              "بدون عنوان";


            const postId =
              post.id ||
              post.slug ||
              post.title ||
              index;


            title.href =
              "../post-detail.html?id=" +
              encodeURIComponent(
                postId
              );


            /* اطلاعات */

            const meta =
              document.createElement(
                "div"
              );

            meta.className =
              "post-meta";


            if (post.date) {

              const date =
                document.createElement(
                  "span"
                );

              date.className =
                "date";

              date.textContent =
                "📅 " +
                toPersianNumbers(
                  gregorianToJalali(
                    post.date
                  )
                );

              meta.appendChild(
                date
              );

            }


            if (post.tag) {

              const category =
                document.createElement(
                  "span"
                );

              category.className =
                "category";

              category.textContent =
                "📂 " +
                post.tag;

              meta.appendChild(
                category
              );

            }


            /* جداکننده */

            const divider =
              document.createElement(
                "div"
              );

            divider.className =
              "post-divider";


            /* خلاصه */

            const excerpt =
              document.createElement(
                "p"
              );

            excerpt.className =
              "post-excerpt";


            if (post.excerpt) {

              excerpt.textContent =
                post.excerpt;

            }

            else if (post.body) {

              let text =
                String(post.body)
                  .replace(
                    /<[^>]*>/g,
                    ""
                  )
                  .replace(
                    /[#*_`]/g,
                    ""
                  )
                  .replace(
                    /\s+/g,
                    " "
                  )
                  .trim();


              if (
                text.length > 360
              ) {

                text =
                  text.substring(
                    0,
                    360
                  ) +
                  "…";

              }


              excerpt.textContent =
                text;

            }

            else {

              excerpt.textContent =
                "برای خواندن این نوشته ادامه مطلب را انتخاب کنید.";

            }


            /* دکمه */

            const readMore =
              document.createElement(
                "a"
              );

            readMore.className =
              "read-more";

            readMore.textContent =
              "ادامه مطلب  ←";

            readMore.href =
              title.href;


            /* ساخت کارت */

            card.appendChild(
              number
            );

            card.appendChild(
              title
            );


            if (
              meta.children.length
            ) {

              card.appendChild(
                meta
              );

            }


            card.appendChild(
              divider
            );

            card.appendChild(
              excerpt
            );

            card.appendChild(
              readMore
            );


            container.appendChild(
              card
            );

          }
        );

      })

      .catch(function(error) {

        console.error(
          "خطا:",
          error
        );


        document.getElementById(
          "posts-container"
        ).innerHTML =

          '<article class="post-card">' +

            '<div class="article-number">' +
              'خطا' +
            '</div>' +

            '<div class="post-title">' +
              'نوشته‌ها فعلاً قابل نمایش نیستند.' +
            '</div>' +

          '</article>';

      });

  </script>


</body>

</html>
