<!doctype html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>وبلاگ حسین محمدی آمیرزا</title>

  <meta
    name="description"
    content="وبلاگ حسین محمدی آمیرزا؛ جست‌وجوی معنا در تاریخ، ادیان و اندیشه"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --black: #080705;
      --black-2: #11100d;
      --black-3: #1a1711;

      --gold: #d4af37;
      --gold-light: #efd574;
      --gold-dark: #9f8126;

      --text: #e6ddca;
      --text-soft: #c6baa4;
      --muted: #958975;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 12% 8%,
          rgba(212,175,55,.12),
          transparent 25%
        ),
        radial-gradient(
          circle at 88% 82%,
          rgba(138,108,42,.10),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #070605 0%,
          #12100d 45%,
          #080705 100%
        );

      background-attachment: fixed;

      font-family:
        "Noto Naskh Arabic",
        "Amiri",
        serif;

      color: var(--text);
    }

    /* ==============================
       قاب اصلی
       ============================== */

    .blog-container {
      width: min(calc(100% - 28px), 1050px);

      margin: 48px auto 65px;

      padding: 58px 62px 65px;

      position: relative;

      background:
        linear-gradient(
          145deg,
          rgba(27,24,19,.98),
          rgba(10,9,7,.98)
        );

      border:
        1px solid rgba(212,175,55,.27);

      border-radius: 30px;

      box-shadow:
        0 35px 90px rgba(0,0,0,.72),
        0 10px 30px rgba(0,0,0,.46),
        inset 0 1px 0 rgba(255,255,255,.035);

      overflow: hidden;
    }

    .blog-container::before {
      content: "";

      position: absolute;
      inset: 15px;

      border:
        1px solid rgba(212,175,55,.09);

      border-radius: 23px;

      pointer-events: none;
    }

    /* ==============================
       هدر
       ============================== */

    .blog-header {
      text-align: center;
      position: relative;

      padding:
        10px 15px 40px;

      margin-bottom: 38px;
    }

    .blog-header::before {
      content: "❈";

      display: block;

      margin-bottom: 10px;

      color: var(--gold);

      font-size: 1.45rem;
    }

    .blog-header h1 {
      font-family:
        "Noto Nastaliq Urdu",
        "Amiri",
        serif;

      font-size:
        clamp(2rem, 5vw, 3.1rem);

      font-weight: 400;

      line-height: 2.1;

      color: var(--gold-light);

      text-align: center;

      text-shadow:
        0 2px 6px rgba(0,0,0,.85),
        0 0 25px rgba(212,175,55,.05);
    }

    .blog-header .subtitle {
      margin-top: 13px;

      font-family:
        "Amiri",
        "Noto Naskh Arabic",
        serif;

      font-size: 1.12rem;

      line-height: 2;

      color: var(--gold-dark);

      text-align: center;
    }

    .gold-line {
      width: 220px;
      height: 1px;

      margin: 23px auto 0;

      background:
        linear-gradient(
          to right,
          transparent,
          var(--gold),
          transparent
        );

      opacity: .7;
    }

    /* ==============================
       فهرست
       ============================== */

    .post-list {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* ==============================
       کارت مقاله
       ============================== */

    .post-card {
      position: relative;

      padding:
        37px
        43px
        40px;

      background:
        linear-gradient(
          145deg,
          rgba(28,24,18,.98),
          rgba(9,8,6,.98)
        );

      border:
        1px solid rgba(212,175,55,.17);

      border-radius: 23px;

      box-shadow:
        0 15px 42px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.025);

      transition:
        transform .28s ease,
        box-shadow .28s ease,
        border-color .28s ease;
    }

    .post-card::before {
      content: "";

      position: absolute;
      inset: 10px;

      border:
        1px solid rgba(212,175,55,.045);

      border-radius: 16px;

      pointer-events: none;
    }

    .post-card::after {
      content: "✦";

      position: absolute;

      top: 18px;
      left: 23px;

      color:
        rgba(212,175,55,.34);

      font-size: .8rem;
    }

    .post-card:hover {
      transform: translateY(-5px);

      border-color:
        rgba(212,175,55,.35);

      box-shadow:
        0 25px 58px rgba(0,0,0,.50);
    }

    /* ==============================
       شماره مقاله
       ============================== */

    .article-number {
      width: fit-content;

      margin: 0 auto 23px;

      padding:
        6px
        20px;

      background:
        linear-gradient(
          180deg,
          #15110b,
          #050403
        );

      border:
        1px solid rgba(212,175,55,.45);

      border-radius: 999px;

      color: var(--gold-light);

      font-size: .9rem;

      box-shadow:
        0 5px 14px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(212,175,55,.07);

      text-align: center;
    }

    /* ==============================
       عنوان مقاله
       ============================== */

    .post-title {
      display: block;

      max-width: 850px;

      margin:
        0
        auto
        20px;

      font-family:
        "Noto Nastaliq Urdu",
        "Amiri",
        serif;

      font-size:
        clamp(1.55rem, 3vw, 2.25rem);

      font-weight: 400;

      line-height: 2.15;

      text-align: center;

      color: var(--gold-light);

      text-decoration: none;

      text-shadow:
        0 2px 8px rgba(0,0,0,.65);

      transition: color .25s ease;
    }

    .post-title:hover {
      color: #ffe9a0;
    }

    /* ==============================
       اطلاعات
       ============================== */

    .post-meta {
      display: flex;

      justify-content: center;
      align-items: center;

      flex-wrap: wrap;

      gap: 9px;

      margin-bottom: 22px;
    }

    .post-meta span {
      padding:
        6px
        16px;

      background: #090806;

      border:
        1px solid rgba(212,175,55,.25);

      border-radius: 999px;

      color: var(--gold);

      font-size: .88rem;

      line-height: 1.7;
    }

    .post-meta .date {
      color: #e5d7ad;
    }

    .post-meta .category {
      color: var(--gold);
    }

    /* ==============================
       جداکننده
       ============================== */

    .post-divider {
      width: 100px;
      height: 1px;

      margin:
        0
        auto
        24px;

      background:
        linear-gradient(
          to right,
          transparent,
          var(--gold),
          transparent
        );

      opacity: .65;
    }

    /* ==============================
       خلاصه
       ============================== */

    .post-excerpt {
      max-width: 800px;

      margin:
        0
        auto
        27px;

      font-family:
        "Noto Naskh Arabic",
        "Amiri",
        serif;

      font-size: 1.07rem;

      line-height: 2.35;

      color: var(--text-soft);

      text-align: right;
    }

    /* ==============================
       دکمه
       ============================== */

    .read-more {
      display: table;

      margin: 0 auto;

      padding:
        9px
        28px;

      background:
        #050403;

      border:
        1px solid rgba(212,175,55,.48);

      border-radius: 999px;

      color: var(--gold-light);

      font-family:
        "Noto Naskh Arabic",
        sans-serif;

      font-size: .95rem;
      font-weight: 600;

      text-decoration: none;

      box-shadow:
        0 5px 16px rgba(0,0,0,.38);

      transition: all .25s ease;
    }

    .read-more:hover {
      background: var(--gold);

      color: #080705;

      border-color: var(--gold);

      transform:
        translateY(-2px);

      box-shadow:
        0 9px 25px rgba(212,175,55,.20);
    }

    /* ==============================
       فوتر
       ============================== */

    .blog-footer {
      position: relative;

      margin-top: 55px;

      padding-top: 31px;

      border-top:
        1px solid rgba(212,175,55,.14);

      text-align: center;

      color: var(--muted);

      font-size: .88rem;
    }

    .blog-footer::before {
      content: "❧  ✦  ❧";

      position: absolute;

      top: -16px;

      left: 50%;

      transform:
        translateX(-50%);

      padding: 0 15px;

      background: #0f0c09;

      color:
        rgba(212,175,55,.55);

      font-size: .8rem;

      letter-spacing: 5px;
    }

    /* ==============================
       موبایل
       ============================== */

    @media (max-width: 700px) {

      .blog-container {
        width: calc(100% - 16px);

        margin:
          15px auto
          28px;

        padding:
          40px
          19px
          48px;

        border-radius: 24px;
      }

      .blog-container::before {
        inset: 9px;
        border-radius: 17px;
      }

      .blog-header {
        padding:
          10px
          8px
          30px;

        margin-bottom: 29px;
      }

      .blog-header h1 {
        font-size: 1.85rem;
        line-height: 2.05;
      }

      .blog-header .subtitle {
        font-size: .98rem;
      }

      .post-list {
        gap: 23px;
      }

      .post-card {
        padding:
          31px
          20px
          34px;

        border-radius: 20px;
      }

      .post-title {
        font-size: 1.48rem;
        line-height: 2.05;
      }

      .post-excerpt {
        font-size: .98rem;
        line-height: 2.2;
      }

      .post-meta span {
        font-size: .80rem;
        padding:
          5px
          11px;
      }

      .read-more {
        font-size: .88rem;
        padding:
          8px
          22px;
      }
    }

  </style>

</head>


<body>

  <main class="blog-container">


    <header class="blog-header">

      <h1>
        وبلاگ حسین محمدی آمیرزا
      </h1>

      <div class="subtitle">
        جست‌وجوی معنا در مسیر تاریخ، ادیان و اندیشه
      </div>

      <div class="gold-line"></div>

    </header>


    <section
      id="posts-container"
      class="post-list"
    >

      <article class="post-card">

        <div class="article-number">
          در حال بارگذاری...
        </div>

        <div class="post-title">
          نوشته‌ها در حال بارگذاری هستند...
        </div>

      </article>

    </section>


    <footer class="blog-footer">

      ©
      <span id="year"></span>
      حسین محمدی آمیرزا

    </footer>


  </main>


  <script>

    /* سال */

    document.getElementById("year").textContent =
      new Date().getFullYear();


    /* اعداد فارسی */

    function toPersianNumbers(value) {

      return String(value)

        .replace(/0/g, "۰")
        .replace(/1/g, "۱")
        .replace(/2/g, "۲")
        .replace(/3/g, "۳")
        .replace(/4/g, "۴")
        .replace(/5/g, "۵")
        .replace(/6/g, "۶")
        .replace(/7/g, "۷")
        .replace(/8/g, "۸")
        .replace(/9/g, "۹");

    }


    /* تاریخ شمسی */

    function gregorianToJalali(value) {

      if (!value) {
        return "";
      }

      const date =
        new Date(value);

      if (isNaN(date.getTime())) {
        return value;
      }

      return new Intl.DateTimeFormat(
        "fa-IR-u-ca-persian",
        {
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }
      ).format(date);

    }


    /* ==========================================
       خواندن posts.json
       ========================================== */

    fetch("../posts/posts/posts.json")

      .then(function(response) {

        if (!response.ok) {
          throw new Error(
            "posts.json پیدا نشد"
          );
        }

        return response.json();

      })

      .then(function(data) {

        /*
         * ساختار فعلی فایل شما:
         *
         * {
         *   "content": "[ ... ]"
         * }
         *
         * بنابراین اگر content رشته باشد
         * باید یک بار دیگر JSON.parse شود.
         */

        let posts = [];


        if (Array.isArray(data)) {

          posts = data;

        }

        else if (
          data &&
          typeof data.content === "string"
        ) {

          posts =
            JSON.parse(data.content);

        }

        else if (
          data &&
          Array.isArray(data.content)
        ) {

          posts =
            data.content;

        }


        const container =
          document.getElementById(
            "posts-container"
          );


        if (
          !Array.isArray(posts) ||
          posts.length === 0
        ) {

          container.innerHTML =

            '<article class="post-card">' +

              '<div class="article-number">' +
                'وبلاگ' +
              '</div>' +

              '<div class="post-title">' +
                'هنوز نوشته‌ای منتشر نشده است.' +
              '</div>' +

            '</article>';

          return;

        }


        /* جدیدترین نوشته اول */

        posts.sort(
          function(a, b) {

            return (
              new Date(b.date || 0) -
              new Date(a.date || 0)
            );

          }
        );


        container.innerHTML = "";


        /* ساخت نوشته‌ها */

        posts.forEach(
          function(post, index) {

            const card =
              document.createElement(
                "article"
              );

            card.className =
              "post-card";


            /* شماره */

            const number =
              document.createElement(
                "div"
              );

            number.className =
              "article-number";

            number.textContent =
              "مقاله شماره " +
              toPersianNumbers(
                index + 1
              );


            /* عنوان */

            const title =
              document.createElement(
                "a"
              );

            title.className =
              "post-title";

            title.textContent =
              post.title ||
              "بدون عنوان";


            const postId =
              post.id ||
              post.slug ||
              post.title ||
              index;


            title.href =
              "../post-detail.html?id=" +
              encodeURIComponent(
                postId
              );


            /* اطلاعات */

            const meta =
              document.createElement(
                "div"
              );

            meta.className =
              "post-meta";


            if (post.date) {

              const date =
                document.createElement(
                  "span"
                );

              date.className =
                "date";

              date.textContent =
                "📅 " +
                toPersianNumbers(
                  gregorianToJalali(
                    post.date
                  )
                );

              meta.appendChild(
                date
              );

            }


            if (post.tag) {

              const category =
                document.createElement(
                  "span"
                );

              category.className =
                "category";

              category.textContent =
                "📂 " +
                post.tag;

              meta.appendChild(
                category
              );

            }


            /* جداکننده */

            const divider =
              document.createElement(
                "div"
              );

            divider.className =
              "post-divider";


            /* خلاصه */

            const excerpt =
              document.createElement(
                "p"
              );

            excerpt.className =
              "post-excerpt";


            if (post.excerpt) {

              excerpt.textContent =
                post.excerpt;

            }

            else {

              let text =
                post.body ||
                post.content ||
                "";


              text =
                String(text)

                  .replace(
                    /<[^>]*>/g,
                    " "
                  )

                  .replace(
                    /[#*_`]/g,
                    ""
                  )

                  .replace(
                    /\s+/g,
                    " "
                  )

                  .trim();


              if (
                text.length > 360
              ) {

                text =
                  text.substring(
                    0,
                    360
                  ) +
                  "…";

              }


              excerpt.textContent =
                text ||
                "برای خواندن این نوشته ادامه مطلب را انتخاب کنید.";

            }


            /* دکمه */

            const readMore =
              document.createElement(
                "a"
              );

            readMore.className =
              "read-more";

            readMore.textContent =
              "ادامه مطلب  ←";

            readMore.href =
              title.href;


            /* ساخت کارت */

            card.appendChild(number);

            card.appendChild(title);


            if (
              meta.children.length
            ) {

              card.appendChild(meta);

            }


            card.appendChild(divider);

            card.appendChild(excerpt);

            card.appendChild(readMore);


            container.appendChild(card);

          }
        );

      })


      .catch(function(error) {

        console.error(
          "خطا در بارگذاری نوشته‌ها:",
          error
        );


        document.getElementById(
          "posts-container"
        ).innerHTML =

          '<article class="post-card">' +

            '<div class="article-number">' +
              'خطا' +
            '</div>' +

            '<div class="post-title">' +
              'نوشته‌ها فعلاً قابل نمایش نیستند.' +
            '</div>' +

          '</article>';

      });

  </script>

</body>

</html>
