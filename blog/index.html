<!doctype html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>وبلاگ حسین محمدی آمیرزا</title>

  <meta
    name="description"
    content="نوشته‌ها و جست‌وجوی معنا در تاریخ، ادیان و اندیشه"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =====================================================
       صفحهٔ اول وبلاگ — طراحی ادبی و هنری
       ===================================================== */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 12% 10%,
          rgba(255, 249, 231, 0.95),
          transparent 28%
        ),

        radial-gradient(
          circle at 88% 85%,
          rgba(177, 204, 179, 0.45),
          transparent 32%
        ),

        radial-gradient(
          circle at 50% 45%,
          rgba(208, 190, 154, 0.18),
          transparent 48%
        ),

        linear-gradient(
          135deg,
          #e8dfcf 0%,
          #d8dfd5 48%,
          #cfded8 100%
        );

      background-attachment: fixed;

      color: #302f2a;

      font-family:
        "Noto Naskh Arabic",
        "Amiri",
        serif;
    }


    /* =====================================================
       قاب اصلی
       ===================================================== */

    .blog-shell {
      width: min(100%, 1040px);

      margin:
        55px
        auto
        70px;

      padding:
        60px
        62px
        70px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 253, 248, 0.97),
          rgba(248, 244, 235, 0.95)
        );

      border:
        1px solid rgba(145, 126, 91, 0.18);

      border-radius: 34px;

      box-shadow:
        0 35px 90px rgba(62, 57, 47, 0.14),
        0 8px 25px rgba(62, 57, 47, 0.08),
        inset 0 1px 0 rgba(255,255,255,0.95);

      position: relative;

      overflow: hidden;
    }


    /* حاشیهٔ داخلی شبیه کتاب نفیس */

    .blog-shell::before {
      content: "";

      position: absolute;

      inset: 18px;

      border:
        1px solid rgba(156, 138, 101, 0.16);

      border-radius: 24px;

      pointer-events: none;
    }


    /* =====================================================
       سربرگ
       ===================================================== */

    .blog-header {
      position: relative;

      text-align: center;

      padding:
        18px
        20px
        38px;

      margin-bottom: 45px;
    }


    .blog-header::before {
      content: "❈";

      display: block;

      margin-bottom: 7px;

      color: #b39a67;

      font-size: 1.5rem;
    }


    .blog-header h1 {
      margin: 0;

      font-family:
        "Noto Nastaliq Urdu",
        "Amiri",
        serif;

      font-size: clamp(2rem, 5vw, 3.15rem);

      font-weight: 400;

      line-height: 2.1;

      color: #354638;

      text-align: center;

      text-shadow:
        0 2px 8px rgba(70,60,45,0.08);
    }


    .blog-header .subtitle {
      margin-top: 15px;

      font-family:
        "Amiri",
        "Noto Naskh Arabic",
        serif;

      font-size: 1.15rem;

      line-height: 2;

      color: #77705f;

      text-align: center;
    }


    .header-line {
      width: 180px;

      height: 1px;

      margin:
        25px
        auto
        0;

      background:
        linear-gradient(
          to right,
          transparent,
          #b7a477,
          transparent
        );
    }


    /* =====================================================
       فهرست نوشته‌ها
       ===================================================== */

    .post-list {
      display: flex;

      flex-direction: column;

      gap: 34px;
    }


    /* =====================================================
       کارت نوشته
       ===================================================== */

    .post-card {
      position: relative;

      padding:
        38px
        42px
        40px;

      background:
        linear-gradient(
          150deg,
          rgba(255,255,255,0.82),
          rgba(244,239,227,0.76)
        );

      border:
        1px solid rgba(145, 126, 91, 0.17);

      border-radius: 24px;

      box-shadow:
        0 12px 35px rgba(61,55,44,0.07),
        inset 0 1px 0 rgba(255,255,255,0.8);

      transition:
        transform .3s ease,
        box-shadow .3s ease,
        border-color .3s ease;
    }


    .post-card::before {
      content: "✦";

      position: absolute;

      top: 19px;

      right: 24px;

      color: rgba(166,143,95,0.48);

      font-size: .95rem;
    }


    .post-card::after {
      content: "✦";

      position: absolute;

      bottom: 17px;

      left: 25px;

      color: rgba(166,143,95,0.28);

      font-size: .8rem;
    }


    .post-card:hover {
      transform: translateY(-5px);

      border-color:
        rgba(132, 150, 116, 0.32);

      box-shadow:
        0 22px 48px rgba(61,55,44,0.12);
    }


    /* =====================================================
       عنوان نوشته
       ===================================================== */

    .post-title {
      display: block;

      margin:
        0
        auto
        18px;

      max-width: 820px;

      font-family:
        "Noto Nastaliq Urdu",
        "Amiri",
        serif;

      font-size: clamp(1.55rem, 3vw, 2.15rem);

      font-weight: 400;

      line-height: 2.05;

      color: #344635;

      text-align: center;

      text-decoration: none;
    }


    .post-title:hover {
      color: #637957;
    }


    /* =====================================================
       اطلاعات نوشته
       ===================================================== */

    .post-meta {
      display: flex;

      align-items: center;

      justify-content: center;

      flex-wrap: wrap;

      gap: 10px 18px;

      margin-bottom: 20px;

      color: #8c826f;

      font-size: .92rem;

      text-align: center;
    }


    .post-meta span {
      padding:
        5px
        13px;

      border-radius: 999px;

      background:
        rgba(225,220,205,0.48);

      border:
        1px solid rgba(149,135,107,0.12);
    }


    /* =====================================================
       خلاصه
       ===================================================== */

    .post-excerpt {
      max-width: 780px;

      margin:
        0
        auto
        24px;

      font-family:
        "Noto Naskh Arabic",
        "Amiri",
        serif;

      font-size: 1.06rem;

      line-height: 2.25;

      color: #4d4a43;

      text-align: right;
    }


    /* =====================================================
       دکمهٔ ادامه
       ===================================================== */

    .read-more {
      display: table;

      margin:
        0
        auto;

      padding:
        8px
        24px;

      border:
        1px solid rgba(125,145,109,0.28);

      border-radius: 999px;

      background:
        rgba(226,232,220,0.42);

      color: #596c51;

      font-family:
        "Noto Naskh Arabic",
        sans-serif;

      font-size: .95rem;

      text-decoration: none;

      transition:
        all .25s ease;
    }


    .read-more:hover {
      transform: translateY(-2px);

      background:
        rgba(208,221,199,0.65);

      border-color:
        #8da07d;

      color: #394d35;

      box-shadow:
        0 8px 20px rgba(82,100,72,0.10);
    }


    /* =====================================================
       فوتر
       ===================================================== */

    .blog-footer {
      position: relative;

      margin-top: 52px;

      padding-top: 30px;

      border-top:
        1px solid rgba(145,126,91,0.16);

      text-align: center;

      color: #8b8272;

      font-size: .9rem;
    }


    .blog-footer::before {
      content: "❧";

      position: absolute;

      top: -17px;

      left: 50%;

      transform: translateX(-50%);

      padding:
        0
        14px;

      background: #f8f4eb;

      color: #ad9568;

      font-size: 1.1rem;
    }


    /* =====================================================
       موبایل
       ===================================================== */

    @media (max-width: 700px) {

      .blog-shell {
        margin:
          18px
          10px
          35px;

        padding:
          38px
          20px
          45px;

        border-radius: 24px;
      }


      .blog-shell::before {
        inset: 10px;

        border-radius: 17px;
      }


      .blog-header {
        padding:
          15px
          10px
          28px;

        margin-bottom: 30px;
      }


      .blog-header h1 {
        font-size: 1.9rem;

        line-height: 2;
      }


      .blog-header .subtitle {
        font-size: 1rem;
      }


      .post-list {
        gap: 22px;
      }


      .post-card {
        padding:
          30px
          20px
          32px;

        border-radius: 20px;
      }


      .post-title {
        font-size: 1.5rem;

        line-height: 2;
      }


      .post-excerpt {
        font-size: .98rem;

        line-height: 2.15;
      }

    }

  </style>
</head>


<body>

  <main class="blog-shell">

    <header class="blog-header">

      <h1>
        وبلاگ حسین محمدی آمیرزا
      </h1>

      <div class="subtitle">
        جست‌وجوی معنا در مسیر تاریخ، ادیان و اندیشه
      </div>

      <div class="header-line"></div>

    </header>


    <section
      id="posts-container"
      class="post-list"
    >
      <article class="post-card">

        <div class="post-title">
          در حال بارگذاری نوشته‌ها...
        </div>

      </article>
    </section>


    <footer class="blog-footer">
      © <span id="year"></span>
      حسین محمدی آمیرزا
    </footer>

  </main>


  <script>

    document.getElementById("year").textContent =
      new Date().getFullYear();


    fetch("../posts/posts/posts.json")

      .then(function(response) {

        if (!response.ok) {
          throw new Error("posts.json پیدا نشد");
        }

        return response.json();

      })

      .then(function(data) {

        let posts;


        if (Array.isArray(data)) {

          posts = data;

        } else if (
          data &&
          typeof data.content === "string"
        ) {

          posts = JSON.parse(data.content);

        } else if (
          data &&
          Array.isArray(data.content)
        ) {

          posts = data.content;

        } else {

          posts = [];

        }


        const container =
          document.getElementById(
            "posts-container"
          );


        if (!posts.length) {

          container.innerHTML =
            '<article class="post-card">' +
            '<div class="post-title">' +
            'هنوز نوشته‌ای منتشر نشده است.' +
            '</div>' +
            '</article>';

          return;
        }


        container.innerHTML = "";


        posts.forEach(function(post, index) {

          const card =
            document.createElement("article");

          card.className = "post-card";


          const title =
            document.createElement("a");

          title.className = "post-title";

          title.textContent =
            post.title || "بدون عنوان";


          const meta =
            document.createElement("div");

          meta.className = "post-meta";


          if (post.date) {

            const date =
              document.createElement("span");

            date.textContent =
              "📅 " + post.date;

            meta.appendChild(date);

          }


          if (post.tag) {

            const tag =
              document.createElement("span");

            tag.textContent =
              "📂 " + post.tag;

            meta.appendChild(tag);

          }


          const excerpt =
            document.createElement("p");

          excerpt.className =
            "post-excerpt";


          if (post.excerpt) {

            excerpt.textContent =
              post.excerpt;

          } else if (post.body) {

            let text =
              post.body
                .replace(/<[^>]*>/g, "")
                .replace(/[#*_`]/g, "");

            if (text.length > 300) {

              text =
                text.substring(0, 300) + "…";

            }

            excerpt.textContent = text;

          } else {

            excerpt.textContent =
              "برای خواندن این نوشته کلیک کنید.";

          }


          const readMore =
            document.createElement("a");

          readMore.className =
            "read-more";

          readMore.textContent =
            "ادامه مطلب ←";


          const postId =
            post.id ||
            post.slug ||
            post.title ||
            index;


          readMore.href =
            "../post-detail.html?id=" +
            encodeURIComponent(postId);


          title.href =
            readMore.href;


          card.appendChild(title);


          if (meta.children.length) {

            card.appendChild(meta);

          }


          card.appendChild(excerpt);

          card.appendChild(readMore);


          container.appendChild(card);

        });

      })

      .catch(function(error) {

        console.error(error);

        document.getElementById(
          "posts-container"
        ).innerHTML =
          '<article class="post-card">' +
          '<div class="post-title">' +
          'در حال حاضر نوشته‌ها قابل نمایش نیستند.' +
          '</div>' +
          '</article>';

      });

  </script>

</body>

</html>
